hosts:
  - id: homelab-server
    display_name: Homelab Server
    category: server
    description: Debian primary homelab server
    lan_ip: 192.168.100.34
    tailscale_ip: 100.64.10.22
    tailscale_hostname: homelab-server
    monitoring_api_url: http://100.64.10.22:4040/api
    control_api_url: http://100.64.10.22:4042/api
    enabled: true
    capabilities:
      - hardware_monitoring
      - history
      - service_control
      - ssh
      - sftp
    services:
      - jellyfin
      - hfs
    tags:
      - debian
      - primary
    probes:
      - type: tcp
        port: 22
        label: SSH

  - id: main-pc
    display_name: Main PC
    category: desktop
    description: Primary Windows workstation reachable over Tailscale
    lan_ip: 192.168.100.50
    tailscale_ip: 100.64.10.50
    tailscale_hostname: main-pc
    enabled: true
    capabilities:
      - wake_on_lan
      - rdp
      - ssh
    tags:
      - windows
      - workstation
    probes:
      - type: tcp
        port: 3389
        label: RDP
      - type: tcp
        port: 22
        label: SSH
