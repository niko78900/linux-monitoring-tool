services:
  - id: jellyfin
    display_name: Jellyfin
    host_id: homelab-server
    adapter: docker
    target: jellyfin
    allowed_actions:
      - start
      - stop
      - restart
    health_probe:
      type: http
      url: http://127.0.0.1:8096
      timeout_seconds: 3

  - id: hfs
    display_name: HFS
    host_id: homelab-server
    adapter: systemd
    target: hfs.service
    allowed_actions:
      - start
      - stop
      - restart
    health_probe:
      type: http
      url: http://127.0.0.1:8081
      timeout_seconds: 3
